name: Informar de un error
description: Algo no funciona como debería.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Antes de enviar, revisa que el registro no contenga datos personales.
        Si es un fallo de seguridad, **no lo publiques aquí**: usa Security → Report a vulnerability.
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
      description: Describe el problema y lo que esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Digo «Hey JARVIS» y pido...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: motor
    attributes:
      label: Motor de IA
      options: ["Local (Ollama)", "Claude", "Automático"]
    validations:
      required: true
  - type: dropdown
    id: interfaz
    attributes:
      label: Dónde ocurre
      multiple: true
      options: ["Interfaz del PC", "Voz", "Telegram", "Esfera de escritorio", "Instalador", "Otro"]
  - type: input
    id: sistema
    attributes:
      label: Equipo
      placeholder: Windows 11 23H2, RTX 3060 12 GB, 32 GB RAM
  - type: textarea
    id: registro
    attributes:
      label: Registro
      description: Fragmento relevante de data/logs/jarvis.log o del Diagnóstico.
      render: text
